# Loaded after compose.yaml by scripts/demo_falhas.py (Compose 2.24.4+).
services:
  ministack:
    ports: !reset []
    volumes: !reset []
  terraform-init:
    image: ponggame-demo/terraform:local
  auth:
    image: ponggame-demo/auth:local
  matchmaking:
    image: ponggame-demo/matchmaking:local
    environment:
      REDIS_HOST: redis
  player:
    image: ponggame-demo/player:local
    environment:
      REDIS_HOST: redis
  game-1:
    image: ponggame-demo/game:local
    environment:
      REDIS_HOST: redis
  game-2:
    image: ponggame-demo/game:local
    environment:
      REDIS_HOST: redis
  game-3:
    extends:
      file: compose.yaml
      service: game-1
    profiles: [escala]
    image: ponggame-demo/game:local
    environment:
      INSTANCE_ID: game-3
      REDIS_HOST: redis
  frontend:
    image: ponggame-demo/frontend:local
  gateway:
    ports: !override ["127.0.0.1::80"]
    networks: !override [gateway_net]
  rabbitmq:
    ports: !override ["127.0.0.1::15672"]
networks:
  gateway_net:
    ipam: !reset {}
