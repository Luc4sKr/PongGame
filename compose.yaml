name: ponggame

services:
  # =========================================================================
  # Cloud Emulation (MiniStack: KMS, ElastiCache, SSM) + Terraform IaC Init
  # =========================================================================
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      GATEWAY_PORT: "4566"
      ELASTICACHE_BASE_PORT: "16379"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-ponggame}_app_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - label:disable
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_ministack/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - app_net

  # Backing Redis instance for ElastiCache fallback (ensures compatibility with
  # rootless Podman / restricted Docker sockets while still discovering via ElastiCache API)
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - app_net

  terraform-init:
    build: ./infra/terraform
    environment:
      TF_VAR_aws_endpoint_url: http://ministack:4566
      TF_VAR_aws_region: ${AWS_REGION:-us-east-1}
      TF_VAR_aws_access_key: ${AWS_ACCESS_KEY_ID:-000000000000}
      TF_VAR_aws_secret_key: ${AWS_SECRET_ACCESS_KEY:-test}
      TF_VAR_kms_key_alias: ${KMS_KEY_ID:-alias/ponggame-jwt-signing}
      TF_VAR_elasticache_cluster_id: ${ELASTICACHE_CLUSTER_ID:-ponggame-redis}
      TF_VAR_jwt_issuer: ${JWT_ISSUER:-PongGame.Auth}
      TF_VAR_jwt_audience: ${JWT_AUDIENCE:-PongGame}
    volumes:
      - terraform_state:/tfstate
    depends_on:
      ministack:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - app_net

  # =========================================================================
  # Message Broker (RabbitMQ)
  # =========================================================================
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-pong}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pong_secret}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - app_net

  # =========================================================================
  # Dedicated Databases (Database-per-Service on isolated internal networks)
  # =========================================================================
  postgres-auth:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pong_auth
      POSTGRES_USER: pong_auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pong_auth_secret}
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h postgres-auth -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -v ON_ERROR_STOP=1 -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - auth_db_net

  postgres-player:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pong_player
      POSTGRES_USER: pong_player
      POSTGRES_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:-pong_player_secret}
    volumes:
      - player_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h postgres-player -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -v ON_ERROR_STOP=1 -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - player_db_net

  # =========================================================================
  # Microservices (C# Auth, Java Player, Java Matchmaking, Go Game x2)
  # =========================================================================
  auth:
    image: ponggame/auth:local
    build: ./services/PongGame.Auth
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Gateway__Address: 172.29.90.2
      ConnectionStrings__AuthDb: Host=postgres-auth;Database=pong_auth;Username=pong_auth
      PGPASSWORD: ${POSTGRES_PASSWORD:-pong_auth_secret}
      Jwt__Issuer: ${JWT_ISSUER:-PongGame.Auth}
      Jwt__Audience: ${JWT_AUDIENCE:-PongGame}
      Kms__KeyId: ${KMS_KEY_ID:-alias/ponggame-jwt-signing}
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-000000000000}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      postgres-auth:
        condition: service_healthy
      terraform-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - gateway_net
      - auth_db_net
      - app_net

  player:
    image: ponggame/player:local
    build: ./services/player-service
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-player:5432/pong_player
      SPRING_DATASOURCE_USERNAME: pong_player
      SPRING_DATASOURCE_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:-pong_player_secret}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pong}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pong_secret}
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-000000000000}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      KMS_KEY_ID: ${KMS_KEY_ID:-alias/ponggame-jwt-signing}
      ELASTICACHE_CLUSTER_ID: ${ELASTICACHE_CLUSTER_ID:-ponggame-redis}
      JWT_ISSUER: ${JWT_ISSUER:-PongGame.Auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-PongGame}
    depends_on:
      postgres-player:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      terraform-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gateway_net
      - player_db_net
      - app_net

  matchmaking:
    image: ponggame/matchmaking:local
    build: ./services/matchmaking-service
    environment:
      SERVER_PORT: "8080"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pong}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pong_secret}
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-000000000000}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      KMS_KEY_ID: ${KMS_KEY_ID:-alias/ponggame-jwt-signing}
      ELASTICACHE_CLUSTER_ID: ${ELASTICACHE_CLUSTER_ID:-ponggame-redis}
      JWT_ISSUER: ${JWT_ISSUER:-PongGame.Auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-PongGame}
      MATCHMAKING_MAX_CONCURRENT_MATCHES: ${MATCHMAKING_MAX_CONCURRENT_MATCHES:-10}
      MATCHMAKING_WINNING_SCORE: ${MATCHMAKING_WINNING_SCORE:-5}
      MATCHMAKING_PROVISIONING_TIMEOUT_MS: ${MATCHMAKING_PROVISIONING_TIMEOUT_MS:-10000}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      terraform-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gateway_net
      - app_net

  game-1:
    image: ponggame/game:local
    build: ./services/game-service
    environment: &game_env
      SERVER_PORT: "8080"
      INSTANCE_ID: game-1
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pong}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pong_secret}
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-000000000000}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      KMS_KEY_ID: ${KMS_KEY_ID:-alias/ponggame-jwt-signing}
      ELASTICACHE_CLUSTER_ID: ${ELASTICACHE_CLUSTER_ID:-ponggame-redis}
      JWT_ISSUER: ${JWT_ISSUER:-PongGame.Auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-PongGame}
      DEPENDENCY_MIN_LATENCY_MS: ${DEPENDENCY_MIN_LATENCY_MS:-50}
      DEPENDENCY_MAX_LATENCY_MS: ${DEPENDENCY_MAX_LATENCY_MS:-150}
      DEPENDENCY_FAILURE_RATE: ${DEPENDENCY_FAILURE_RATE:-0.0}
      GAME_TICK_HZ: ${GAME_TICK_HZ:-30}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      terraform-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gateway_net
      - app_net

  game-2:
    image: ponggame/game:local
    build: ./services/game-service
    environment:
      <<: *game_env
      INSTANCE_ID: game-2
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      terraform-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gateway_net
      - app_net

  # =========================================================================
  # Frontend SPA (React + TypeScript + Vite)
  # =========================================================================
  frontend:
    image: ponggame/frontend:local
    build: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - gateway_net

  # =========================================================================
  # API Gateway & WebSocket Load Balancer (Nginx)
  # =========================================================================
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      frontend:
        condition: service_healthy
      auth:
        condition: service_healthy
      player:
        condition: service_healthy
      matchmaking:
        condition: service_healthy
      game-1:
        condition: service_healthy
      game-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      gateway_net:
        ipv4_address: 172.29.90.2

networks:
  gateway_net:
    ipam:
      config:
        - subnet: 172.29.90.0/24
          ip_range: 172.29.90.16/28
  app_net:
  auth_db_net:
    internal: true
  player_db_net:
    internal: true

volumes:
  auth_data:
  player_data:
  redis_data:
  terraform_state:
