map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Do not write the WebSocket query string: it contains the access token.
log_format pong_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent request_time=$request_time '
                     'upstream_time=$upstream_response_time traceparent="$http_traceparent"';

upstream game_cluster {
    server game-1:8080 max_fails=2 fail_timeout=5s;
    server game-2:8080 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log pong_safe;
    otel_trace_context propagate;
    otel_trace $trace_api;

    location = /telemetry/v1/traces {
        otel_trace_context ignore;
        otel_trace off;
        limit_except POST { deny all; }
        client_max_body_size 1m;
        resolver 127.0.0.11 valid=5s;
        set $otel_upstream observability:4318;
        proxy_pass http://$otel_upstream/v1/traces;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location = /health {
        otel_trace_context ignore;
        otel_trace off;
        add_header Content-Type application/json;
        return 200 '{"status":"UP","service":"gateway"}';
    }

    location /api/auth/ {
        otel_span_name "$request_method /api/auth";
        resolver 127.0.0.11 valid=5s;
        set $auth_upstream auth:8080;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/players {
        otel_span_name "$request_method /api/players";
        resolver 127.0.0.11 valid=5s;
        set $player_upstream player:8080;
        proxy_pass http://$player_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/matchmaking {
        otel_span_name "$request_method /api/matchmaking";
        resolver 127.0.0.11 valid=5s;
        set $matchmaking_upstream matchmaking:8080;
        proxy_pass http://$matchmaking_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/game/ {
        otel_span_name "$request_method /api/game";
        proxy_pass http://game_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/game/ {
        otel_trace_context ignore;
        otel_trace off;
        proxy_pass http://game_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        otel_trace_context ignore;
        otel_trace off;
        resolver 127.0.0.11 valid=5s;
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
