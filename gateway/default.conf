map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream game_cluster {
    server game-1:8080 max_fails=2 fail_timeout=5s;
    server game-2:8080 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;

    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"UP","service":"gateway"}';
    }

    location /api/auth/ {
        resolver 127.0.0.11 valid=5s;
        set $auth_upstream auth:8080;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/players {
        resolver 127.0.0.11 valid=5s;
        set $player_upstream player:8080;
        proxy_pass http://$player_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/matchmaking {
        resolver 127.0.0.11 valid=5s;
        set $matchmaking_upstream matchmaking:8080;
        proxy_pass http://$matchmaking_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/game/ {
        proxy_pass http://game_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/game/ {
        proxy_pass http://game_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        resolver 127.0.0.11 valid=5s;
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
