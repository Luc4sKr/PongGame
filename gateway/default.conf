server {
    listen 80;

    location /api/auth/ {
        resolver 127.0.0.11 valid=5s;
        set $auth_upstream auth:8080;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
