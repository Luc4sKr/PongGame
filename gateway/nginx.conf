load_module /usr/lib/nginx/modules/ngx_otel_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    otel_exporter {
        endpoint observability:4317;
        interval 1s;
    }
    otel_service_name ponggame-gateway;
    otel_resource_attr service.namespace ponggame;
    otel_resource_attr deployment.environment.name local;

    map "$otel_parent_id:$otel_parent_sampled" $trace_api {
        ~^.+:0$ off;
        default on;
    }

    include /etc/nginx/conf.d/*.conf;
}
