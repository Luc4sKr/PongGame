server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: player-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-player:5432/pong_player}
    username: ${SPRING_DATASOURCE_USERNAME:pong_player}
    password: ${SPRING_DATASOURCE_PASSWORD:pong_player_secret}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pong}
    password: ${RABBITMQ_PASSWORD:pong_secret}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 500ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 2000ms
        missing-queues-fatal: false

app:
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint-url: ${AWS_ENDPOINT_URL:}
    access-key: ${AWS_ACCESS_KEY_ID:000000000000}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  kms:
    key-id: ${KMS_KEY_ID:alias/ponggame-jwt-signing}
    cache-ttl-seconds: ${KMS_PUBLIC_KEY_CACHE_TTL_SECONDS:300}
  jwt:
    issuer: ${JWT_ISSUER:PongGame.Auth}
    audience: ${JWT_AUDIENCE:PongGame}
  elasticache:
    cluster-id: ${ELASTICACHE_CLUSTER_ID:ponggame-redis}
    redis-host-override: ${REDIS_HOST:}
    redis-port-override: ${REDIS_PORT:0}
  cache:
    player-ttl-seconds: ${PLAYER_CACHE_TTL_SECONDS:60}
  rabbitmq:
    events-exchange: ${RABBITMQ_EVENTS_EXCHANGE:pong.events}
    dlx-exchange: ${RABBITMQ_DLX_EXCHANGE:pong.dlx}
    match-finished-queue: ${PLAYER_MATCH_FINISHED_QUEUE:player.match.finished}
    match-finished-dlq: ${PLAYER_MATCH_FINISHED_DLQ:player.match.finished.dlq}
    match-finished-routing-key: match.finished
