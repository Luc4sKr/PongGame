server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"UP","service":"frontend"}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
