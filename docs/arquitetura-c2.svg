<title id="title">PongGame — Diagrama de contêineres C4, nível 2</title>
<desc id="description">O jogador usa uma SPA React. O gateway Nginx encaminha as requisições ao servidor estático e a quatro serviços. Uma matriz identifica as relações dos serviços com os dois PostgreSQL, o Redis, o RabbitMQ e o MiniStack.</desc>
