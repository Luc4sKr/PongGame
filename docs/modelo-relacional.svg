<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" width="1440" height="1040" role="img" aria-labelledby="title desc">
<title id="title">PongGame — Modelo relacional dos serviços Auth e Player</title>
<desc id="desc">O banco pong_auth armazena contas e sessões. O banco pong_player armazena perfis, histórico de partidas e mensagens processadas. Cada sessão pertence a uma conta e cada registro de histórico pertence a um jogador. Ambas as chaves estrangeiras têm exclusão em cascata. Os dois serviços identificam a mesma pessoa pelo UUID da conta.</desc>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#183347}
.title{font-size:40px;font-weight:700}.sub{font-size:19px;fill:#425d6a}.db{font-family:Consolas,monospace;font-size:28px;font-weight:bold}.service{font-size:18px;fill:#425d6a}.table{font-family:Consolas,monospace;font-size:22px;font-weight:bold;fill:white}.purpose{font-size:14px;fill:white}.field,.type,.sql,.key,.null{font-family:Consolas,monospace}.field,.type{font-size:16px}.type{fill:#435867}.key,.null{font-size:12px;font-weight:bold;fill:#254b61}.sql{font-size:14px;fill:#314e60}.label{font-size:13px;font-weight:bold;letter-spacing:.7px;fill:#425e6d}.note{font-size:17px;fill:#294553}.body{font-size:16px;fill:#425b67}.cardinality{font-size:15px;font-weight:700}.legend{font-size:15px;fill:#314e60}
</style>
<rect x="0" y="0" width="1440" height="1040" rx="0" fill="#fff" stroke="none"/>
<text x="42" y="58" class="title" text-anchor="start">Modelo relacional do PongGame</text>
<text x="44" y="93" class="sub" text-anchor="start">Estrutura física das tabelas de aplicação em PostgreSQL</text>
<text x="1396" y="61" class="legend" text-anchor="end">PK   Chave primária     ·     FK   Chave estrangeira</text>
<text x="1396" y="88" class="legend" text-anchor="end">Todas as colunas são obrigatórias, salvo indicação NULL.</text>
<rect x="32" y="122" width="1376" height="313" rx="16" fill="#f1f6fa" stroke="#ccdae3"/>
<rect x="58" y="144" width="5" height="31" rx="2" fill="#235477" stroke="none"/>
