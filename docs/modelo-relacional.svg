<path d="M464 265H514V291H564" fill="none" stroke="#235477" stroke-width="2"/>
<text x="478" y="257" class="cardinality" text-anchor="start">1</text>
<text x="554" y="283" class="cardinality" text-anchor="end">0..N</text>
<path d="M464 599H514V651H564" fill="none" stroke="#14635e" stroke-width="2"/>
<text x="478" y="591" class="cardinality" text-anchor="start">1</text>
<text x="554" y="643" class="cardinality" text-anchor="end">0..N</text>
<text x="1006" y="223" class="label" text-anchor="start">IDENTIDADE ENTRE SERVIÇOS</text>
<text x="1006" y="251" class="note" text-anchor="start">O Auth emite o UUID de auth_users.id</text>
<text x="1006" y="275" class="note" text-anchor="start">no campo sub do JWT. O Player usa</text>
<text x="1006" y="299" class="note" text-anchor="start">esse UUID como players.id.</text>
<text x="1006" y="323" class="note" text-anchor="start">O vínculo é lógico, sem FK entre bancos.</text>
<text x="1006" y="352" class="label" text-anchor="start">CICLO DE VIDA DA SESSÃO</text>
<text x="1006" y="380" class="note" text-anchor="start">Excluir uma conta remove suas sessões</text>
<text x="1006" y="404" class="note" text-anchor="start">por ON DELETE CASCADE.</text>
<text x="1006" y="739" class="label" text-anchor="start">PROCESSAMENTO DE EVENTOS</text>
<text x="1006" y="767" class="note" text-anchor="start">O Player registra message_id na mesma</text>
<text x="1006" y="791" class="note" text-anchor="start">transação que atualiza o placar e o</text>
<text x="1006" y="815" class="note" text-anchor="start">histórico. Uma reentrega do evento</text>
<text x="1006" y="839" class="note" text-anchor="start">com o mesmo ID é ignorada.</text>
<text x="1006" y="878" class="label" text-anchor="start">HISTÓRICO POR JOGADOR</text>
<text x="1006" y="906" class="note" text-anchor="start">player_id é a FK com ON DELETE CASCADE.</text>
<text x="1006" y="930" class="note" text-anchor="start">opponent_id identifica o adversário e</text>
<text x="1006" y="954" class="note" text-anchor="start">match_id agrupa os registros da partida.</text>
<text x="74" y="948" class="label" text-anchor="start">VALORES INICIAIS</text>
<text x="74" y="974" class="body" text-anchor="start">Elo começa em 1000 e os contadores em 0.</text>
<text x="580" y="974" class="body" text-anchor="start">duration_seconds tem valor inicial 0.</text>
</svg>
