{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "PongGame",
      "folder": "PongGame",
      "interval": "10s",
      "rules": [
        {
          "uid": "pong-broker-down",
          "title": "Game sem conexão com RabbitMQ",
          "condition": "B",
          "for": "10s",
          "noDataState": "NoData",
          "execErrState": "Error",
          "isPaused": false,
          "annotations": {
            "summary": "Game sem conexão com RabbitMQ",
            "description": "Alerta local para demonstrar o cenário. Consulte o dashboard PongGame e o trace da execução."
          },
          "labels": {
            "project": "ponggame",
            "severity": "warning"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 60,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "min(pong_game_broker_connected)",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "A"
                      ]
                    },
                    "reducer": {
                      "type": "last"
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "pong-outbox",
          "title": "Eventos acumulados na outbox",
          "condition": "B",
          "for": "10s",
          "noDataState": "NoData",
          "execErrState": "Error",
          "isPaused": false,
          "annotations": {
            "summary": "Eventos acumulados na outbox",
            "description": "Alerta local para demonstrar o cenário. Consulte o dashboard PongGame e o trace da execução."
          },
          "labels": {
            "project": "ponggame",
            "severity": "warning"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 60,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(pong_matchmaking_outbox_pending) + max(pong_game_outbox_pending)",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "A"
                      ]
                    },
                    "reducer": {
                      "type": "last"
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "pong-dlq",
          "title": "Mensagens aguardando análise na DLQ",
          "condition": "B",
          "for": "10s",
          "noDataState": "NoData",
          "execErrState": "Error",
          "isPaused": false,
          "annotations": {
            "summary": "Mensagens aguardando análise na DLQ",
            "description": "Alerta local para demonstrar o cenário. Consulte o dashboard PongGame e o trace da execução."
          },
          "labels": {
            "project": "ponggame",
            "severity": "warning"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 60,
                "to": 0
